<style>

box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="dark"]{--bg:#0f1a21;--surface:#172630;--ink:#e4edf1;--muted:#93a8b3;--line:#2b404c;--accent:#5cc0e0;--accent-ink:#06222d;--ok:#5fd09a;--warn:#f0a24f;--bad:#f08a78;--wall:#9fb6c2;--water:#0f1a21;--scale:#8a6a42;--hl:#1d3340;color-scheme:dark}
html{font-size:18px;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;line-height:1.6;font-variant-numeric:tabular-nums}
main{max-width:760px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.4rem;margin:0 0 4px;font-weight:700}
.sub{color:var(--muted);margin:0 0 18px;font-size:.92rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}

.hint{color:var(--muted);font-size:.8rem;font-weight:400}

#c{font-size:1.6rem;font-weight:700;padding:12px 14px}
details{margin-top:14px}
summary{cursor:pointer;font-weight:500;color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:12px}
.read{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.read svg{width:132px;height:132px;flex:none}
.big{font-size:2.4rem;font-weight:700;line-height:1.1}
.big small{font-size:1rem;font-weight:400;color:var(--muted)}
.chip{display:inline-block;padding:2px 10px;border-radius:99px;font-size:.82rem;font-weight:500;border:1.5px solid currentColor}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 14px;margin:10px 0 0;font-size:.95rem}
.kv dt{color:var(--muted)}.kv dd{margin:0;font-weight:500}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{padding:7px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--muted);font-weight:500;font-size:.82rem}
tr.sel td{background:var(--hl);font-weight:700}
tr.near td{background:var(--hl)}
td button{font:inherit;color:var(--accent);background:none;border:1px solid var(--line);border-radius:6px;padding:3px 10px;cursor:pointer;min-width:84px;text-align:left}
tr.sel td button{border-color:var(--accent);font-weight:700}
.note{font-size:.85rem;color:var(--muted);margin:10px 0 0}
.act{margin-top:12px;font:inherit;background:var(--accent);color:var(--accent-ink);border:0;border-radius:6px;padding:9px 16px;cursor:pointer;font-weight:500}
.empty{color:var(--muted);text-align:center;padding:26px 8px}
h2{font-size:1.02rem;margin:0 0 8px}
.topbar{display:flex;gap:8px;margin:0 0 14px;flex-wrap:wrap}.tb{font:inherit;font-size:.92rem;color:var(--accent);background:var(--surface);border:1px solid var(--accent);border-radius:8px;padding:7px 12px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}.tb.on{background:var(--hl);font-weight:700}
</style>
</head>
<body>
<main>
<div class="topbar"><a class="tb" href="index.html">← 泵浦換算工具</a><button class="tb" id="thToggle" type="button" title="切換深色背景" aria-label="切換深色背景"></button></div>
<h1>外周長 → 管徑與壁厚估算</h1>
<p class="sub">用 π 尺量到的外周長，換算外徑並對照 ASME B36.10 碳鋼管表。壁厚無法由周長直接得知，請搭配 UT 測厚校核。</p>

<section class="card">
  <label for="c">外周長 <span class="hint">mm，量到裸金屬面</span></label>
  <input id="c" type="number" inputmode="decimal" step="0.1" min="0" placeholder="例如 1285" autofocus>
  <div style="margin-top:12px"><label for="mode">管種規格</label><select id="mode"><option value="sgp">SGP（JIS G3452，台灣常用）</option><option value="asme">ASME B36.10（STPG 壁厚同 SCH）</option></select></div>
  <details>
    <summary>進階設定（選填）</summary>
    <div class="grid">
      <div><label for="coat">外覆層厚度 <span class="hint">mm，單邊</span></label><input id="coat" type="number" inputmode="decimal" step="0.1" min="0" value="0"></div>
      <div><label for="ut">壁厚 <span class="hint">mm，UT 實測或假設值</span></label><input id="ut" type="number" inputmode="decimal" step="0.01" min="0" placeholder="空白＝用下表所選"></div>
      <div><label for="scale">內壁垢層厚度 <span class="hint">mm，估計值</span></label><input id="scale" type="number" inputmode="decimal" step="0.1" min="0" value="0"></div>
    </div>
  </details>
</section>

<section class="card" id="out"><div class="empty">輸入外周長後，這裡會顯示外徑、管徑規格與可能的壁厚。</div></section>
<section class="card" id="tbl" hidden></section>

<p class="note">標準表值為標稱壁厚（製造公差約 −12.5%）。SGP 依 JIS G3452，125A～300A 的外徑與 ASME 不同。大口徑捲板管常為非標準外徑，以實測外徑為準。夾式流量計請以 UT 實測壁厚輸入主機。</p>
</main>
<script>
// [label, wall mm]；STD/40 等同值合併顯示
const P=[

{n:'2.5"',od:73.0,s:[['10',3.05],['STD/40',5.16],['XS/80',7.01],['160',9.53]]},

{n:'4"',od:114.3,s:[['10',3.05],['STD/40',6.02],['XS/80',8.56],['120',11.13],['160',13.49]]},
{n:'5"',od:141.3,s:[['10',3.40],['STD/40',6.55],['XS/80',9.53],['120',12.70],['160',15.88]]},

{n:'8"',od:219.1,s:[['10',3.76],['20',6.35],['30',7.04],['STD/40',8.18],['60',10.31],['XS/80',12.70],['100',15.09],['120',18.26],['140',20.62],['160',23.01]]},
{n:'10"',od:273.1,s:[['10',4.19],['20',6.35],['30',7.80],['STD/40',9.27],['XS/60',12.70],['80',15.09],['100',18.26],['120',21.44],['140',25.40],['160',28.58]]},
{n:'12"',od:323.9,s:[['10',4.57],['20',6.35],['30',8.38],['STD',9.53],['40',10.31],['XS',12.70],['60',14.27],['80',17.48],['100',21.44],['120',25.40],['140',28.58],['160',33.32]]},
{n:'14"',od:355.6,s:[['10',6.35],['20',7.92],['STD/30',9.53],['40',11.13],['XS',12.70],['60',15.09],['80',19.05],['100',23.83],['120',27.76],['140',31.75],['160',35.71]]},
{n:'16"',od:406.4,s:[['10',6.35],['20',7.92],['STD/30',9.53],['XS/40',12.70],['60',16.66],['80',21.44],['100',26.19],['120',30.96],['140',36.53],['160',40.49]]},
{n:'18"',od:457.2,s:[['10',6.35],['20',7.92],['STD',9.53],['30',11.13],['XS',12.70],['40',14.27],['60',19.05],['80',23.83],['100',29.36],['120',34.93],['140',39.67],['160',45.24]]},
{n:'20"',od:508.0,s:[['10',6.35],['STD/20',9.53],['XS/30',12.70],['40',15.09],['60',20.62],['80',26.19],['100',32.54],['120',38.10],['140',44.45],['160',50.01]]},
{n:'24"',od:609.6,s:[['10',6.35],['STD/20',9.53],['XS',12.70],['30',14.27],['40',17.48],['60',24.61],['80',30.96],['100',38.89],['120',46.02],['140',52.37],['160',59.54]]},
{n:'30"',od:762.0,s:[['10',7.92],['STD',9.53],['XS/20',12.70],['30',15.88]]},
{n:'36"',od:914.4,s:[['10',7.92],['STD',9.53],['XS/20',12.70],['30',15.88],['40',19.05]]}
];
const SGPD=[['6A (1/8")',10.5,2.0],['8A (1/4")',13.8,2.3],['10A (3/8")',17.3,2.3],['15A (1/2")',21.7,2.8],['20A (3/4")',27.2,2.8],['25A (1")',34.0,3.2],['32A (1-1/4")',42.7,3.5],['40A (1-1/2")',48.6,3.5],['50A (2")',60.5,3.8],['65A (2-1/2")',76.3,4.2],['80A (3")',89.1,4.2],['90A (3-1/2")',101.6,4.2],['100A (4")',114.3,4.5],['125A (5")',139.8,4.5],['150A (6")',165.2,5.0],['175A (7")',190.7,5.3],['200A (8")',216.3,5.8],['225A (9")',241.8,6.2],['250A (10")',267.4,6.6],['300A (12")',318.5,6.9],['350A (14")',355.6,7.9],['400A (16")',406.4,7.9],['450A (18")',457.2,7.9],['500A (20")',508.0,7.9],['550A (22")',558.8,8.7],['600A (24")',609.6,9.5]];
const $=id=>document.getElementById(id);
const sl=x=>x==='SGP'?'SGP':'SCH '+x;
function cur(){return $('mode').value==='asme'?P.map(p=>({...p,n:'NPS '+p.n})):SGPD.map(([n,od,t])=>({n,od,s:[['SGP',t]]}))}
const num=id=>{const v=parseFloat($(id).value);return isNaN(v)?NaN:v};
let selKey=null;

function render(){
  const C=num('c'),coat=num('coat')||0,scale=num('scale')||0,ut=num('ut');
  const out=$('out'),tbl=$('tbl');
  if(!(C>0)){out.innerHTML='<div class="empty">輸入外周長後，這裡會顯示外徑、管徑規格與可能的壁厚。</div>';tbl.hidden=true;return}
  const odm=C/Math.PI-2*coat;
  if(!(odm>0)){out.innerHTML='<div class="empty">外覆層厚度過大，請檢查輸入。</div>';tbl.hidden=true;return}
  let best=null;
  for(const p of cur()){const d=(odm-p.od)/p.od*100;if(!best||Math.abs(d)<Math.abs(best.d))best={p,d}}
  const p=best.p,dev=best.d,ad=Math.abs(dev);
  const lvl=ad<=0.5?'ok':ad<=1?'warn':'bad';
  const msg={ok:'符合標準外徑',warn:'接近標準外徑，可能含公差或橢圓度',bad:'偏離標準外徑，可能為捲板管或非標管'}[lvl];
  const odUse=ad<=1?p.od:odm; // 吻合標準時採標稱外徑
  // 預設列
  if(!selKey||!selKey.startsWith(p.n+'|')){const d=p.s.find(r=>r[0].includes('STD'))||p.s[1]||p.s[0];selKey=p.n+'|'+d[0]}
  const rows=p.s;
  let t,src,nearIdx=-1;
  if(ut>0){t=ut;src='輸入壁厚';let m=1e9;rows.forEach((r,i)=>{const d=Math.abs(r[1]-ut);if(d<m){m=d;nearIdx=i}})}
  else{const r=rows.find(r=>p.n+'|'+r[0]===selKey)||rows[0];t=r[1];src='表列 '+sl(r[0])}
  const idOf=w=>odUse-2*w-2*scale;
  const area=w=>{const d=idOf(w);return d>0?Math.PI/4*d*d/100:NaN};
  const id=idOf(t),A=area(t);
  if(!(id>0)){out.innerHTML='<div class="empty">壁厚與垢層合計超過半徑，請檢查輸入。</div>';tbl.hidden=true;return}
  // 鄰近壁厚的截面積差
  const ts=[...new Set(rows.map(r=>r[1]))].sort((a,b)=>a-b);
  const lo=[...ts].reverse().find(x=>x<t-0.005),hi=ts.find(x=>x>t+0.005);
  const pc=w=>{const a=area(w);return isNaN(a)?'—':((a/A-1)*100>=0?'+':'−')+Math.abs((a/A-1)*100).toFixed(1)+'%'};
  const nearTxt=ut>0?`最接近 ${sl(rows[nearIdx][0])}（${rows[nearIdx][1].toFixed(2)} mm），差 ${Math.abs(rows[nearIdx][1]-ut).toFixed(2)} mm`:'';
  // 剖面圖
  const R=odUse/2,k=54/R,rid=Math.max((R-t)*k,0),rs=Math.max((R-t-scale)*k,0);
  const svg=`<svg viewBox="0 0 120 120" role="img" aria-label="管剖面示意"><circle cx="60" cy="60" r="54" fill="var(--wall)"/><circle cx="60" cy="60" r="${rid.toFixed(2)}" fill="${scale>0?'var(--scale)':'var(--water)'}"/>${scale>0?`<circle cx="60" cy="60" r="${rs.toFixed(2)}" fill="var(--water)"/>`:''}</svg>`;
  out.innerHTML=`<div class="read">${svg}<div>
    <div class="big">${odm.toFixed(1)} <small>mm 外徑</small></div>
    <div style="margin-top:6px"><span class="chip ${lvl}">${msg}</span></div>
    <div class="note" style="margin-top:6px">最接近 ${p.n}（標稱 OD ${p.od} mm，差 ${dev>=0?'+':'−'}${ad.toFixed(2)}%）</div></div></div>
    <dl class="kv">
    <dt>壁厚 t</dt><dd>${t.toFixed(2)} mm（${src}）${nearTxt?'<br><span class="hint">'+nearTxt+'</span>':''}</dd>
    <dt>內徑 ID</dt><dd>${id.toFixed(1)} mm${scale>0?'（已扣垢層 '+scale+' mm）':''}</dd>
    <dt>流通截面積</dt><dd>${A.toFixed(1)} cm²</dd>
    <dt>若壁厚判斷錯一級</dt><dd>${lo?`t=${lo.toFixed(2)}：${pc(lo)}`:'—'}　${hi?`t=${hi.toFixed(2)}：${pc(hi)}`:''}</dd>
    <dt>計算採用外徑</dt><dd>${odUse.toFixed(1)} mm（${ad<=1?'標稱值':'實測值'}）</dd></dl>
    ${lvl==='bad'?'<p class="note">外徑不在標準管表內，下表僅供參考。建議直接輸入 UT 實測壁厚。</p>':''}
    <button class="act" id="cp">複製記錄</button>`;
  $('cp').onclick=async()=>{
    const s=`外周長 ${C} mm；外徑 ${odm.toFixed(1)} mm；${p.n}（${msg}）；壁厚 ${t.toFixed(2)} mm（${src}）；內徑 ${id.toFixed(1)} mm；截面積 ${A.toFixed(1)} cm²`;
    try{await navigator.clipboard.writeText(s);$('cp').textContent='已複製'}catch(e){$('cp').textContent='無法複製，請手動記錄'}
  };
  // 表格
  tbl.hidden=false;
  tbl.innerHTML=`<h2>${p.n} 標準壁厚（OD ${p.od} mm）</h2><div class="tw"><table><thead><tr><th>SCH</th><th>壁厚 mm</th><th>內徑 mm</th><th>截面積 cm²</th><th>面積差</th></tr></thead><tbody>${
    rows.map((r,i)=>{const a=area(r[1]);const isSel=ut>0?false:(p.n+'|'+r[0]===selKey);
    return `<tr class="${isSel?'sel':''}${i===nearIdx?' near':''}"><td><button data-k="${p.n}|${r[0]}" aria-pressed="${isSel}">${r[0]}</button></td><td>${r[1].toFixed(2)}</td><td>${isNaN(a)?'—':idOf(r[1]).toFixed(1)}</td><td>${isNaN(a)?'—':a.toFixed(1)}</td><td>${isNaN(a)?'—':pc(r[1])}</td></tr>`}).join('')
  }</tbody></table></div><p class="note">點選 SCH 可切換假設壁厚；「面積差」以目前壁厚為基準。</p>`;
  tbl.querySelectorAll('button[data-k]').forEach(b=>b.onclick=()=>{selKey=b.dataset.k;$('ut').value='';render()});
}
['c','coat','ut','scale','mode'].forEach(i=>$(i).addEventListener('input',render));
const SUN='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" stroke="#F59E0B" stroke-width="2"/><circle cx="12" cy="12" r="4.5" fill="#FCD34D" stroke="#F59E0B" stroke-width="1.6"/></svg>';
const MOON='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" fill="#818CF8" stroke="#4F46E5" stroke-width="1.6"/><path d="M18 3.2l.55 1.25 1.25.55-1.25.55L18 6.8l-.55-1.25L16.2 5l1.25-.55z" fill="#FBBF24" stroke="#F59E0B" stroke-width=".6"/></svg>';
let curTheme='white';
function setTheme(k){curTheme=k==='dark'?'dark':'white';document.documentElement.setAttribute('data-theme',curTheme==='dark'?'dark':'light');const b=$('thToggle'),t=curTheme==='dark'?'切換淺色背景':'切換深色背景';b.innerHTML=curTheme==='dark'?SUN:MOON;b.title=t;b.setAttribute('aria-label',t);try{localStorage.setItem('pumpTheme',curTheme)}catch(e){}}
let st='white';try{st=localStorage.getItem('pumpTheme')||'white'}catch(e){}
setTheme(st);
$('thToggle').onclick=()=>setTheme(curTheme==='dark'?'white':'dark');
</script>
<script>
/* ===== 全站備份／同步（手機 ↔ 電腦）：所有頁面共用同一份資料 ===== */
(function(){
var LSK=['pumpRecords','pumpTbl','pumpTheme','flowSurveyRecs','flowSurveyDraft','pa47SurveyRecs_v8','pa47SurveyDraft_v8','pa47Theme','pumpDrawState'];
var IDBS=[{db:'pa47SurveyPhotos',st:'p'},{db:'pumpDraw',st:'kv'}];
var RECS={pumpRecords:'id',flowSurveyRecs:'name',pa47SurveyRecs_v8:'id'};
var DRAFT={flowSurveyDraft:1,pa47SurveyDraft_v8:1,pumpDrawState:1};
function z(n){return String(n).padStart(2,'0')}
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v);return true}catch(e){return false}}
function openDB(n,st){return new Promise(function(res){try{var r=indexedDB.open(n,1);r.onupgradeneeded=function(){if(!r.result.objectStoreNames.contains(st))r.result.createObjectStore(st)};r.onsuccess=function(){res(r.result)};r.onerror=function(){res(null)}}catch(e){res(null)}})}
function dbAll(db,st){return new Promise(function(res){if(!db)return res({});try{var out={},tx=db.transaction(st,'readonly'),s=tx.objectStore(st),c=s.openCursor();c.onsuccess=function(){var k=c.result;if(k){out[String(k.key)]=k.value;k.continue()}else res(out)};c.onerror=function(){res(out)}}catch(e){res({})}})}
function dbPut(db,st,k,v){return new Promise(function(res){if(!db)return res(false);try{var tx=db.transaction(st,'readwrite');tx.objectStore(st).put(v,k);tx.oncomplete=function(){res(true)};tx.onerror=function(){res(false)}}catch(e){res(false)}})}
function b2u(b){return new Promise(function(res){if(!(b instanceof Blob))return res(b);var r=new FileReader();r.onload=function(){res({__blob:r.result})};r.onerror=function(){res(null)};r.readAsDataURL(b)})}
function u2b(o){if(!o||typeof o!=='object'||typeof o.__blob!=='string')return o;try{var m=/^data:([^;,]*)(;base64)?,(.*)$/.exec(o.__blob),bin=m[2]?atob(m[3]):decodeURIComponent(m[3]),a=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return new Blob([a],{type:m[1]||'application/octet-stream'})}catch(e){return null}}
async function deep(v,f){if(v instanceof Blob)return await f(v);if(Array.isArray(v)){var a=[];for(var i=0;i<v.length;i++)a.push(await deep(v[i],f));return a}if(v&&typeof v==='object'&&!(v instanceof Date)){if(v.__blob)return f(v);var o={};for(var k in v)o[k]=await deep(v[k],f);return o}return v}
async function collect(){
  var out={app:'pump-tool-backup',v:1,t:new Date().toISOString(),ls:{},idb:{}};
  LSK.forEach(function(k){var v=lsGet(k);if(v!=null)out.ls[k]=v});
  for(var i=0;i<IDBS.length;i++){var d=IDBS[i],db=await openDB(d.db,d.st),all=await dbAll(db,d.st);if(db)db.close();var o={};for(var k in all)o[k]=await deep(all[k],b2u);if(Object.keys(o).length)out.idb[d.db]=o}
  return out;
}
function summary(b){
  var c=function(k){try{var a=JSON.parse(b.ls[k]||'[]');return Array.isArray(a)?a.length:0}catch(e){return 0}};
  var ph=0,pi=(b.idb&&b.idb.pa47SurveyPhotos)||{};Object.keys(pi).forEach(function(k){var o=pi[k];if(o)ph+=((o.motor||[]).length+(o.pump||[]).length)});
  return [['泵浦換算紀錄',c('pumpRecords')],['流量量測紀錄',c('flowSurveyRecs')],['現場資料表紀錄',c('pa47SurveyRecs_v8')],['銘牌照片',ph]];
}
function merge(cur,inc,key){
  var a=[];try{a=JSON.parse(cur||'[]');if(!Array.isArray(a))a=[]}catch(e){a=[]}
  var b=[];try{b=JSON.parse(inc||'[]');if(!Array.isArray(b))b=[]}catch(e){b=[]}
  var add=0,upd=0;
  b.forEach(function(r){if(!r||r[key]==null)return;var i=a.findIndex(function(x){return x&&x[key]===r[key]});
    if(i<0){a.push(r);add++}else if(!a[i].t||!r.t||String(r.t)>=String(a[i].t)){if(JSON.stringify(a[i])!==JSON.stringify(r)){a[i]=r;upd++}}});
  return {v:JSON.stringify(a),add:add,upd:upd};
}
async function apply(b,withDraft){
  var n={add:0,upd:0};
  Object.keys(RECS).forEach(function(k){if(b.ls[k]==null)return;var m=merge(lsGet(k),b.ls[k],RECS[k]);lsSet(k,m.v);n.add+=m.add;n.upd+=m.upd});
  var ph=(b.idb&&b.idb.pa47SurveyPhotos)||{},pdb=await openDB('pa47SurveyPhotos','p');
  for(var k in ph){if(k==='draft'&&!withDraft)continue;await dbPut(pdb,'p',k,ph[k])}
  if(pdb)pdb.close();
  if(withDraft){
    Object.keys(DRAFT).forEach(function(k){if(b.ls[k]!=null)lsSet(k,b.ls[k])});
    var dr=(b.idb&&b.idb.pumpDraw)||{};
    if(dr.last){var ddb=await openDB('pumpDraw','kv');await dbPut(ddb,'kv','last',await deep(dr.last,u2b));if(ddb)ddb.close()}
  }
  return n;
}
async function save(blob,name){
  try{var d=(typeof claude!=='undefined'&&claude.use)?await claude.use('downloads'):null;if(d){await d.save({filename:name,data:blob});return}}catch(e){if(e&&e.code==='declined')return}
  var f=null;try{f=new File([blob],name,{type:'application/json'})}catch(e){}
  if(f&&matchMedia('(pointer:coarse)').matches&&navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:'泵浦工具備份'});return}catch(e){if(e&&e.name==='AbortError')return}}
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(a.href)},2000);
}
